name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy --strict, includes examples/)
        run: mypy
      - name: Test
        run: pytest
      - name: Examples import (type-checked by mypy above; no network)
        run: python -c "import importlib.util as u; s = u.spec_from_file_location('flows', 'examples/flows.py'); s.loader.exec_module(u.module_from_spec(s))"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build API reference (mkdocs-material + mkdocstrings)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          python -m pip install -e ".[docs]"
          mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
