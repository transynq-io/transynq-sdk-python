site_name: Transynq Python SDK
site_description: "Official Python SDK for Transynq TMS, the transport management system for carriers, fleet operators, 3PLs, brokers and shippers: bookings, dispatch, live tracking, driver POD, invoicing and costing through the Transynq API."
site_author: Transynq
repo_url: https://github.com/transynq-io/transynq-sdk-python
docs_dir: docs
site_dir: site
strict: true
copyright: "&copy; 2026 <a href=\"https://transynq.io/\">Transynq</a> &middot; <a href=\"https://transynq.io/transport-management-system\">Transynq TMS</a> &middot; MIT licence"
theme:
  name: material
  logo: assets/brand/transynq-icon-64.png
  favicon: assets/brand/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
extra:
  social:
    - icon: material/web
      link: https://transynq.io/
      name: Transynq - transport management software
    - icon: material/truck-fast
      link: https://transynq.io/transport-management-system
      name: Transynq TMS - transport management system
    - icon: fontawesome/brands/github
      link: https://github.com/transynq-io/transynq-sdk-python
      name: Transynq Python SDK on GitHub
extra_css:
  - assets/brand/transynq.css
nav:
  - Home: README.md
  - Getting started: getting-started.md
  - Authentication: authentication.md
  - Configuration: configuration.md
  - Error handling: error-handling.md
  - Pagination: pagination.md
  - Concurrency: concurrency.md
  - Idempotency: idempotency.md
  - Long-running operations: long-running-operations.md
  - Files: files.md
  - Logging and observability: logging-and-observability.md
  - Types: types.md
  - Testing: testing.md
  - Versioning: versioning.md
  - Troubleshooting: troubleshooting.md
  - Resource index: resources/README.md
  - API reference: reference.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source
            docstring_style: sphinx
validation:
  links:
    not_found: warn
    anchors: warn
