site_name: Transynq Python SDK
site_description: Official Python client for the Transynq TMS API
repo_url: https://github.com/transynq-io/transynq-sdk-python
docs_dir: docs
site_dir: site
strict: true
copyright: "&copy; 2026 Transynq &middot; MIT licence &middot; Intelligent Transport Operations"
theme:
  name: material
  logo: assets/brand/transynq-icon-64.png
  favicon: assets/brand/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
extra_css:
  - assets/brand/transynq.css
nav:
  - Home: README.md
  - Getting started: getting-started.md
  - Authentication: authentication.md
  - Configuration: configuration.md
  - Error handling: error-handling.md
  - Pagination: pagination.md
  - Concurrency: concurrency.md
  - Idempotency: idempotency.md
  - Long-running operations: long-running-operations.md
  - Files: files.md
  - Logging and observability: logging-and-observability.md
  - Types: types.md
  - Testing: testing.md
  - Versioning: versioning.md
  - Troubleshooting: troubleshooting.md
  - Resource index: resources/README.md
  - API reference: reference.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source
            docstring_style: sphinx
validation:
  links:
    not_found: warn
    anchors: warn
