[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "transynq"
version = "1.0.3"
description = "Official Python SDK for Transynq TMS, the transport management system for carriers, fleet operators, 3PLs, brokers and shippers: bookings, dispatch, live tracking, driver POD, invoicing and costing through the Transynq API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Transynq", email = "contact@transynq.io" }]
keywords = ["transynq", "tms", "transport-management-system", "transport-management-software", "transport", "logistics", "freight", "trucking", "fleet-management", "dispatch", "3pl", "proof-of-delivery", "shipment-tracking", "api-client", "sdk", "python", "asyncio", "httpx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25,<1",
    "pydantic>=2.5,<3",
    "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://transynq.io/transport-management-system"
Website = "https://transynq.io/"
Documentation = "https://github.com/transynq-io/transynq-sdk-python/tree/main/docs"
Repository = "https://github.com/transynq-io/transynq-sdk-python"
Issues = "https://github.com/transynq-io/transynq-sdk-python/issues"
Changelog = "https://github.com/transynq-io/transynq-sdk-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "mypy>=1.10", "ruff>=0.5"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/transynq"]

[tool.hatch.build.targets.sdist]
include = ["src/transynq", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["assets", "docs", "site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]
files = ["src/transynq", "tests", "examples"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.ruff]
line-length = 160
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP037", "UP045", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"src/transynq/_generated/**" = ["E501", "RUF001", "RUF002", "RUF003"]
