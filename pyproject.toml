[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "transynq"
version = "1.0.0"
description = "Official Python client for the Transynq TMS API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Transynq" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.25,<1",
    "pydantic>=2.5,<3",
    "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://github.com/qadir0108/transynq-sdk-python"
Documentation = "https://github.com/qadir0108/transynq-sdk-python/tree/main/docs"
Repository = "https://github.com/qadir0108/transynq-sdk-python"
Changelog = "https://github.com/qadir0108/transynq-sdk-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "mypy>=1.10", "ruff>=0.5"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/transynq"]

[tool.hatch.build.targets.sdist]
include = ["src/transynq", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["assets", "docs", "site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]
files = ["src/transynq", "tests", "examples"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.ruff]
line-length = 160
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP037", "UP045", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"src/transynq/_generated/**" = ["E501", "RUF001", "RUF002", "RUF003"]
